<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>K-means · assignment / update</title><link rel="stylesheet" href="vendor/katex/katex.min.css"><link rel="stylesheet" href="widget.css?v=scale-mode"><body>
<header><label>Данные <select id="dataset"><option value="blobs2">Два облака</option><option value="elongated">Два вытянутых облака</option><option value="blobs" selected>Три облака</option><option value="blobs4">Четыре облака</option><option value="moons">Луны</option><option value="circles">Круги</option></select></label><label>K <select id="k"><option>2</option><option selected>3</option><option>4</option><option>5</option></select></label><span id="scale-status" hidden>Исходные координаты · K = 2</span><button id="standardize" hidden>Стандартизировать</button><button id="reset">Сначала</button><button id="new">Другой старт</button><button id="play">▶ Воспроизвести</button></header>
<div class="layout"><section class="plot-area"><div class="phase-bar"><span id="phase">Initialization</span><span id="iteration">Итерация 0</span></div><svg id="plot" viewBox="0 0 680 350" role="img" aria-label="Анимация точек и центров k-means"></svg><div class="step-buttons"><button id="assign">Assignment step</button><button id="update">Update step</button></div><p class="hint">● точки &nbsp; ✚ центры · До первого шага центры можно перетаскивать.</p></section>
<aside><div class="code-line" id="assign-code"><h3>Assignment step</h3><p class="comment"># Центры фиксированы; меняем метки</p><div data-tex="a_i\leftarrow\arg\min_k\|x_i-c_k\|_2^2"></div></div><div class="code-line" id="update-code"><h3>Update step</h3><p class="comment"># Метки фиксированы; меняем центры</p><div data-tex="c_k\leftarrow\frac1{|S_k|}\sum_{i\in S_k}x_i"></div></div><div class="loss-heading"><span data-tex="J(a,c)"></span><strong id="loss">—</strong></div><svg id="loss-plot" viewBox="0 0 360 115" aria-label="Сумма квадратов после каждого завершённого шага"></svg><p class="hint" id="explanation" aria-live="polite">Выбраны начальные центры. Следующий шаг назначит точки.</p></aside></div>
<script src="vendor/d3.v7.min.js"></script><script src="vendor/engine.js"></script><script src="vendor/katex/katex.min.js"></script><script src="math.js"></script><script src="widget.js?v=presets"></script></body></html>
