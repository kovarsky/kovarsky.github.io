<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DBSCAN: рост плотных групп</title><link rel="stylesheet" href="step-demos.css"></head><body>
<header><label>Данные <select id="dataset"><option value="blobs2">Два облака</option><option value="blobs">Три облака</option><option value="blobs4">Четыре облака</option><option value="moons" selected>Две луны</option><option value="circles">Кольца</option><option value="uniform">Равномерные точки</option></select></label><label>ε <input id="eps" type="range" min=".05" max="2.5" step=".05" value=".55"><output id="eps-value">0.55</output></label><label>min_samples <input id="minimum" type="number" min="1" max="50" value="5"></label><button id="reset">Сначала</button><button id="back">Назад</button><button id="next">Шаг</button><button id="play">▶ Запуск</button><button id="finish">Результат</button></header>
<div class="density-layout"><div><svg id="density-plot" viewBox="0 0 700 400" aria-label="Точки, кластеры DBSCAN и ε-окрестность выбранной точки"></svg><div class="density-legend"><span>● ядровая</span><span>○ граничная</span><span>× шум</span></div><div class="small">Бледные точки ещё не проверены.</div></div><aside><h2>Окрестность точки</h2><label>Точка № <input id="point-picker" type="number" min="1" value="1"></label><p id="neighbors-info"></p><p id="message" aria-live="polite"></p><p class="density-summary" id="db-summary"></p><p class="small">Число соседей включает саму точку. Круг показывает радиус ε.</p></aside></div>
<p id="db-progress"></p><footer>Один шаг — проверка одной точки. Нажмите на точку, чтобы рассмотреть её окрестность. До конца обхода шум может стать граничной точкой.</footer>
<script src="vendor/d3.v7.min.js"></script><script src="vendor/engine.js"></script><script src="demo-models.js"></script><script src="dbscan.js"></script></body></html>
