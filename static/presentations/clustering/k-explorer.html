<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Число кластеров и качество</title><link rel="stylesheet" href="k-explorer.css"></head><body>
<header><label>Данные <select id="dataset"><option value="blobs2">Два облака</option><option value="blobs" selected>Три облака</option><option value="blobs4">Четыре облака</option><option value="moons">Две луны</option><option value="circles">Кольца</option><option value="uniform">Равномерные точки</option></select></label><div class="k-control"><button id="less" aria-label="Уменьшить K">−</button><label for="k">K = <output id="k-value">3</output></label><input id="k" type="range" min="1" max="8" value="3" aria-label="Число кластеров K"><button id="more" aria-label="Увеличить K">+</button></div><output id="score" aria-live="polite"></output></header>
<main><section><h2>Разбиение точек</h2><svg id="points" viewBox="0 0 540 340" role="img" aria-label="Точки данных и найденные кластеры"></svg></section><section><h2 id="chart-title"></h2><svg id="curve" viewBox="0 0 540 245" aria-label="Значение метрики при разном числе кластеров"></svg><svg id="widths" viewBox="0 0 540 95" role="img" aria-label="Силуэтные ширины отдельных точек"></svg><p id="delta"></p></section></main>
<div id="point-details"><label>Точка <input id="point-index" type="number" min="1" value="1" aria-label="Номер точки"></label><span id="details" aria-live="polite"></span></div>
<p id="hint"></p><footer>Одинаковые данные для всех K · лучший J из 10 стартов k-means++ · нажмите на график, чтобы выбрать K</footer>
<script src="vendor/d3.v7.min.js"></script><script src="k-explorer-data.js"></script><script src="k-explorer.js"></script></body></html>
