<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>K-means: случайный старт и k-means++</title><link rel="stylesheet" href="step-demos.css"></head><body>
<header><label>Данные <select id="dataset"><option value="blobs2">Два облака</option><option value="elongated">Два вытянутых облака</option><option value="blobs" selected>Три облака</option><option value="blobs4">Четыре облака</option><option value="moons">Две луны</option><option value="circles">Кольца</option><option value="uniform">Равномерные точки</option></select></label><label>K <select id="k"><option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></label><button id="new">Другой старт</button><button id="reset">Сначала</button><button id="back">Назад</button><button id="next">Шаг</button><button id="play">▶ Запуск</button><button id="finish">Результат</button></header>
<div class="compare-grid"><section><h2>Случайный старт k-means</h2><svg id="random-plot" viewBox="0 0 560 255" aria-label="Кластеры k-means со случайной инициализацией"></svg><p id="random-status" class="status"></p></section><section><h2>Инициализация k-means++</h2><svg id="plus-plot" viewBox="0 0 560 255" aria-label="Кластеры с инициализацией k-means++"></svg><p id="plus-status" class="status"></p></section></div>
<div class="compare-bottom"><svg id="comparison-loss" viewBox="0 0 700 140" aria-label="J обоих запусков по шагам алгоритма"></svg><div><p class="legend"><span class="random-line">━</span> случайный старт<br><span class="plus-line">┄</span> k-means++</p><p id="step-label" aria-live="polite"></p></div></div>
<footer>Одни данные, K и первый центр. Сравниваем число шагов и итоговое J. Стоимость выбора начальных центров не учитывается. K-means++ не гарантирует лучший результат в каждом запуске.</footer>
