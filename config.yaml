baseURL: "https://kovarsky.github.io/"
title: "BK"
theme: "PaperMod"
languageCode: "en-us"
defaultContentLanguage: "en"
defaultContentLanguageInSubdir: true

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

params:
  env: production
  title: "BK"
  description: "My personal blog about ML, DeFi, travel and genealogy"
  author: "Your Name"
  defaultTheme: auto
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false

  # Social icons (shared for all languages)
  socialIcons:
    - name: github
      url: "https://github.com/kovarsky"
    - name: email
      url: "mailto:your@email.com"

languages:
  en:
    languageName: "English"
    weight: 1
    contentDir: "content/en"
    params:
      homeInfoParams:
        Title: "Hi there 👋"
        Content: ""
    menu:
      main:
        - identifier: home
          name: "Home"
          url: /
          weight: 1
  ru:
    languageName: "Русский"
    weight: 2
    contentDir: "content/ru"
    params:
      homeInfoParams:
        Title: "Привет 👋"
        Content: ""
    menu:
      main:
        - identifier: home
          name: "Главная"
          url: /
          weight: 1

# Search / outputs
outputs:
  home:
    - HTML
    - RSS
    - JSON

# Markdown settings
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    style: monokai

# Taxonomies
taxonomies:
  tag: tags
  category: categories
  series: series
