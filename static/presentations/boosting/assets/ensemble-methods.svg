<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Бэггинг, бустинг и стэкинг</title>
<desc id="desc">Бэггинг: модели на выборках с возвращением, затем среднее или голосование. Градиентный бустинг: новая модель приближает поправку к текущему прогнозу, цикл повторяется. Стэкинг: прогнозы базовых моделей становятся входами обучаемой метамодели.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 8 4 0 8" fill="#8293a2"/></marker></defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#243343;text-anchor:middle;font-size:21px}
.heading{font-size:28px;font-weight:600}.caption{font-size:18px;fill:#66707c}.small{font-size:17px}
.node{fill:#f7f9fb;stroke:#c7d2dc;stroke-width:1.3}.model{fill:#edf5fc;stroke:#99bddc;stroke-width:1.3}
.edge{fill:none;stroke:#8293a2;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
.bus{fill:none;stroke:#8293a2;stroke-width:1.7;stroke-linejoin:round}
</style>
<path d="M400 12V408M800 12V408" stroke="#e1e7ed"/>
<!-- Bagging: aligned, parallel branches. -->
<text class="heading" x="200" y="31">Бэггинг</text><text class="caption" x="200" y="60">Обучаем модели независимо</text>
<rect class="node" x="110" y="88" width="180" height="44" rx="8"/><text x="200" y="116">Данные</text>
<path class="bus" d="M200 132V151M73 151H327"/>
<path class="edge" d="M73 151V170"/><path class="edge" d="M200 151V170"/><path class="edge" d="M327 151V170"/>
<rect class="node" x="20" y="170" width="106" height="34" rx="6"/><rect class="node" x="147" y="170" width="106" height="34" rx="6"/><rect class="node" x="274" y="170" width="106" height="34" rx="6"/>
<text class="small" x="73" y="192">Выборка 1</text><text class="small" x="200" y="192">Выборка 2</text><text class="small" x="327" y="192">Выборка 3</text>
<path class="edge" d="M73 204V230"/><path class="edge" d="M200 204V230"/><path class="edge" d="M327 204V230"/>
<rect class="model" x="20" y="230" width="106" height="42" rx="8"/><rect class="model" x="147" y="230" width="106" height="42" rx="8"/><rect class="model" x="274" y="230" width="106" height="42" rx="8"/>
<text x="73" y="257">Модель 1</text><text x="200" y="257">Модель 2</text><text x="327" y="257">Модель 3</text>
<path class="bus" d="M73 272V298H327V272M200 272V298"/><path class="edge" d="M200 298V326"/>
<rect x="35" y="326" width="330" height="48" rx="8" fill="#eaf4ef" stroke="#9fbfb2" stroke-width="1.3"/><text x="200" y="357">Среднее / голосование</text>
<text class="caption" x="200" y="405">Выборки — с возвращением</text>
<!-- Boosting: training cycle, not predictions fed as input features. -->
<text class="heading" x="600" y="31">Бустинг</text><text class="caption" x="600" y="60">Уточняем ансамбль последовательно</text>
<rect class="node" x="455" y="88" width="285" height="44" rx="8"/><text x="597" y="116">Текущий прогноз</text>
<path class="edge" d="M597 132V194"/><rect x="473" y="150" width="248" height="24" fill="white"/><text class="caption" x="597" y="168">Цели по ошибкам ансамбля</text>
<rect class="model" x="455" y="194" width="285" height="50" rx="8"/><text x="597" y="225">Новая модель</text>
<path class="edge" d="M597 244V326"/><rect x="481" y="273" width="232" height="24" fill="white"/><text class="caption" x="597" y="291">Добавляем её поправку</text>
<rect x="455" y="326" width="285" height="48" rx="8" fill="#fff2e9" stroke="#dab39a" stroke-width="1.3"/><text x="597" y="357">Обновлённый прогноз</text>
<path class="edge" d="M740 350H775V110H740" stroke-dasharray="5 4"/>
<text class="caption" x="600" y="405">Повторяем с новым прогнозом</text>
<!-- Stacking: outputs of the base models become features. -->
<text class="heading" x="1000" y="31">Стэкинг</text><text class="caption" x="1000" y="60">Учимся объединять прогнозы</text>
<rect class="node" x="910" y="88" width="180" height="44" rx="8"/><text x="1000" y="116">Данные</text>
<path class="bus" d="M1000 132V162M873 162H1127"/>
<path class="edge" d="M873 162V194"/><path class="edge" d="M1000 162V194"/><path class="edge" d="M1127 162V194"/>
<rect class="model" x="820" y="194" width="106" height="50" rx="8"/><rect class="model" x="947" y="194" width="106" height="50" rx="8"/><rect class="model" x="1074" y="194" width="106" height="50" rx="8"/>
<text x="873" y="225">Модель 1</text><text x="1000" y="225">Модель 2</text><text x="1127" y="225">Модель 3</text>
<path class="bus" d="M873 244V268H1127V244M1000 244V268"/><path class="edge" d="M1000 268V326"/>
<rect x="872" y="280" width="256" height="24" fill="white"/><text class="caption" x="1000" y="298">Их прогнозы — новые признаки</text>
<rect x="835" y="326" width="330" height="48" rx="8" fill="#eaf4ef" stroke="#9fbfb2" stroke-width="1.3"/><text x="1000" y="357">Обучаемая метамодель</text>
<text class="caption" x="1000" y="405">Базовые модели могут быть разными</text>
</svg>
